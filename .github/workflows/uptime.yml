name: Uptime check

# Check of the public site and API every 6 hours (was hourly; saves Actions minutes). An external monitor (e.g. UptimeRobot) is recommended for faster alerts. If it fails, GitHub emails the repository owner. Read-only: it sends two GET requests and nothing else.
# Scheduled workflows only run from the default branch (main).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Site and API respond
        env:
          BASE: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -eu
          ua='flightdeck-uptime-check (github actions)'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 20 -A "$ua" "$BASE/")
          [ "$code" = 200 ] || { echo "Home returned $code"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 20 -A "$ua" "$BASE/app/")
          [ "$code" = 200 ] || { echo "App (/app/) returned $code"; exit 1; }
          body=$(curl -sS --retry 3 --retry-delay 10 --max-time 20 -A "$ua" "$BASE/api/config")
          echo "$body" | grep -q 'liveAvailable' || { echo "API config did not answer as expected"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -A "$ua" "$BASE/api/me")
          [ "$code" = 401 ] || { echo "/api/me returned $code, expected 401 without a token"; exit 1; }
          echo "OK"
