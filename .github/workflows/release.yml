name: Production release
# Manual only (owner decision 28 Oct 2026). Default mode "check-only" runs tests and the build and uploads nothing.
# A real release needs mode=release and confirm=RELEASE, and runs only from main. Additive upload only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check-only (no upload) or release (publish to production)'
        type: choice
        options: [check-only, release]
        default: check-only
      confirm:
        description: 'Type RELEASE to publish (ignored for check-only)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false  # never cancel mid-upload
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard release inputs
        # Inputs go through env, never straight into the script (prevents shell injection).
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [ "$MODE" = "release" ]; then
            [ "$CONFIRM" = "RELEASE" ] || { echo "Type RELEASE in the confirm input to publish."; exit 1; }
            [ "$REF" = "refs/heads/main" ] || { echo "Releases run only from main."; exit 1; }
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:php
      - name: Build
        env:
          # Public by design. Optional: when unset the app is built without login.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          # GA4 Measurement ID, public by design. Loads only after the visitor opts in; when unset the app is built without analytics.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: pnpm build
      - name: Check-only summary
        if: inputs.mode != 'release'
        run: |
          echo "Check-only run: tests and build passed. Nothing was uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release private PHP source (restricted key, additive rsync)
        if: inputs.mode == 'release'
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_SSH_HOST: ${{ secrets.RELEASE_SSH_HOST }}
          RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          printf '%s\n' "$RELEASE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt -e "ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p 21098" \
            php/private/src/ "$RELEASE_SSH_HOST":flightdeck-private/src/
          rm -f ~/.ssh/release_key
      - name: Release static app and verify over public HTTPS
        if: inputs.mode == 'release'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python3 scripts/release-static.py
