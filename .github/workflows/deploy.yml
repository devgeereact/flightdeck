# Deploy on every push to main, but only after the full CI gate passes on that same commit:
# `check` calls ci.yml (lint, types, unit and PHP tests, build, UI and console smoke tests, php -l, gitleaks),
# and `deploy` needs it. Then the same `scripts/release.mjs --go` as on the Mac, over SSH (no FTP).
# A failed smoke test restores the previous files automatically (snapshot in ~/backups/<project>/releases on the server).
# Docs-only pushes do not deploy. A commit message with [skip ci] does not deploy.
# A manual run (workflow_dispatch) runs the same gate and deploys only from main.
# Pull requests run ci.yml directly and never reach this file.
# Secrets (set by ~/Backups/scripts/setup-github-deploy.zsh): CPANEL_SSH_KEY, CPANEL_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only one deploy at a time; a deploy that has started is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: SSH to cPanel
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY is not set: run setup-github-deploy.zsh"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host cpanel\n  HostName premium17.web-hosting.com\n  Port 21098\n  User devgeereact\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Release
        run: node scripts/release.mjs --go

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
